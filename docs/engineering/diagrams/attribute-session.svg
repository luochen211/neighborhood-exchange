<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">邻里闲置：登录会话实体属性图</title><desc id="desc">矩形实体、椭圆属性，标识属性加下划线。</desc>
<rect width="1200" height="800" fill="white"/>
<g font-family="Songti SC, Noto Serif CJK SC, serif" fill="#111" stroke-linejoin="miter">
<text x="600" y="55" font-size="34" text-anchor="middle" dominant-baseline="central" font-weight="bold">图 2  登录会话实体属性图</text>
<line x1="600" y1="382" x2="600" y2="216" stroke="#111" stroke-width="2"/>
<line x1="690" y1="420" x2="954" y2="420" stroke="#111" stroke-width="2"/>
<line x1="600" y1="458" x2="600" y2="624" stroke="#111" stroke-width="2"/>
<line x1="510" y1="420" x2="246" y2="420" stroke="#111" stroke-width="2"/>
<rect x="510" y="382" width="180" height="76" fill="white" stroke="#111" stroke-width="2.5"/>
<text x="600" y="420" font-size="29" text-anchor="middle" dominant-baseline="central" font-weight="bold">登录会话</text>
<ellipse cx="600" cy="185" rx="86" ry="31" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="600" y="185" font-size="23" text-anchor="middle" dominant-baseline="central" text-decoration="underline">会话编号</text>
<ellipse cx="1040" cy="420" rx="86" ry="31" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="1040" y="420" font-size="23" text-anchor="middle" dominant-baseline="central">令牌哈希</text>
<ellipse cx="600" cy="655" rx="86" ry="31" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="600" y="655" font-size="23" text-anchor="middle" dominant-baseline="central">到期时间</text>
<ellipse cx="160" cy="420" rx="86" ry="31" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="160" y="420" font-size="23" text-anchor="middle" dominant-baseline="central">创建时间</text>
<text x="600" y="755" font-size="22" text-anchor="middle" dominant-baseline="central">下划线表示标识属性；实体间引用见局部和全局实体联系图。</text>
</g>
</svg>
