    "/items": {
      "get": {
        "operationId": "listItems",
        "description": "Default active includes AVAILABLE/RESERVED. archive includes GIVEN. Search and filters use AND. Order createdAt DESC,id DESC.  Unknown input properties are rejected. Writes require same-origin Origin (absent Origin allowed for local clients). JSON body limit 32KB; business writes 60/user/min. Cookie auth and role checks remain server responsibilities.",
        "security": [],
        "parameters": [
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 2048
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "default": 20,
              "type": "integer",
              "minimum": 1,
              "maximum": 50
            }
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 100
            }
          },
          {
            "name": "tradeMode",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "FREE",
